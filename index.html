async function callClaude(content) {
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-5",
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content }],
    }),
  });
  const data = await res.json();
  const raw = data.content?.map(i => i.text || "").join("") || "{}";
  return JSON.parse(raw.replace(/```json|```/g, "").trim());
}

// ── DEDUP HELPERS ──────────────────────────────────────────
function similarity(a, b) {
  if (!a || !b) return 0;
  const wa = new Set(a.toLowerCase().split(/\s+/).filter(w => w.length > 3));
  const wb = new Set(b.toLowerCase().split(/\s+/).filter(w => w.length > 3));
  let overlap = 0;
  wa.forEach(w => { if (wb.has(w)) overlap++; });
  return overlap / Math.max(wa.size, wb.size, 1);
}

function findTxDuplicate(newTx, existing) {
  return existing.find(t => {
    const sameBuyer    = t.buyer?.toLowerCase() === newTx.buyer?.toLowerCase();
    const sameSeller   = t.seller?.toLowerCase() === newTx.seller?.toLowerCase();
    const sameLocation = t.location?.toLowerCase() === newTx.location?.toLowerCase();
    const sameType     = t.type?.toLowerCase() === newTx.type?.toLowerCase();
    return sameBuyer && sameSeller && sameLocation && sameType;
  });
}

function findIntelDuplicate(newItem, existing) {
  const newText = newItem.bullets?.join(" ") || "";
  return existing.find(e => {
    if (Math.abs(new Date(e.date) - new Date(newItem.date)) > 7 * 86400000) return false;
    const eText = e.bullets?.join(" ") || "";
    return similarity(newText, eText) > 0.65;
  });
}

// ── MARKET PULSE TAB ───────────────────────────────────────
function MarketPulse({ pulseWeeks, onAddWeek }) {
  const [analyzing, setAnalyzing] = useState(false);
  const [error, setError] = useState(null);
  const latest = pulseWeeks[0] || null;
  const prev   = pulseWeeks[1] || null;

  async function analyzeForPulse(content) {
    setAnalyzing(true); setError(null);
    try {
      const res = await fetch("/api/claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-5",
          max_tokens: 1500,
          system: PULSE_SYSTEM_PROMPT,
          messages: [{ role: "user", content }],
        }),
      });
      const data = await res.json();
      const raw = data.content?.map(i => i.text || "").join("") || "{}";
      const parsed = JSON.parse(raw.replace(/```json|```/g, "").trim());
      if (parsed.week) {
        onAddWeek({ ...parsed, id: Date.now() });
      } else {
        setError("Kunde inte extrahera marknadsdata – kontrollera att dokumentet innehåller aktiekurser.");
      }
    } catch { setError("Analysen misslyckades."); }
    setAnalyzing(false);
  }

  return (
    <div className="fade">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 24 }}>
        <div>
          <h2 style={{ fontFamily: "Instrument Serif, serif", fontSize: 28, fontWeight: 400 }}>Marknadspuls</h2>
          {latest && <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 4 }}>Senaste data: {latest.week} · {latest.date}</div>}
        </div>
        <div style={{ fontSize: 12, color: "#9ca3af", textAlign: "right" }}>
          Analyseras automatiskt när du laddar upp<br />ett nyhetsbrev via "Lägg till"
        </div>
      </div>

      {!latest && (
        <div style={{ textAlign: "center", padding: "60px 0", color: "#9ca3af", fontSize: 14, border: "2px dashed #f0f0f0", borderRadius: 16 }}>
          Ingen marknadsdata ännu. Ladda upp ett Colliers Weekly eller liknande nyhetsbrev via "Lägg till".
        </div>
      )}

      {latest && (
        <>
          {/* Rate strip */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14, marginBottom: 20 }}>
            {[
              { label: "Swapränta 5Y", value: latest.rates?.swap5y ? `${latest.rates.swap5y}%` : "–", prev: prev?.rates?.swap5y, up: latest.rates?.swap5y > (prev?.rates?.swap5y || 0) },
              { label: "Statsobligation 10Y", value: latest.rates?.govBond10y ? `${latest.rates.govBond10y}%` : "–", prev: prev?.rates?.govBond10y, up: latest.rates?.govBond10y > (prev?.rates?.govBond10y || 0) },
              { label: "Spread (swap-stats)", value: latest.rates?.spread ? `${latest.rates.spread.toFixed(2)}%` : "–", prev: prev?.rates?.spread, neutral: true },
            ].map(k => {
              const hasChange = k.prev != null && k.prev !== 0;
              const diff = hasChange ? (parseFloat(latest.rates?.[k.label === "Swapränta 5Y" ? "swap5y" : k.label === "Statsobligation 10Y" ? "govBond10y" : "spread"]) - k.prev).toFixed(2) : null;
              return (
                <div key={k.label} className="card" style={{ padding: "20px 22px" }}>
                  <div style={{ fontSize: 11, color: "#9ca3af", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>{k.label}</div>
                  <div style={{ fontSize: 24, fontFamily: "Instrument Serif, serif", color: "#111", marginBottom: 6 }}>{k.value}</div>
                  {diff != null && (
                    <div style={{ fontSize: 11, fontWeight: 600, color: k.neutral ? "#6b7280" : k.up ? "#dc2626" : "#16a34a" }}>
                      {k.up ? "▲" : "▼"} {Math.abs(diff)}% vs förra veckan
                    </div>

                </div>
              );
            })}

          {/* Stock strip */}
          <div className="card" style={{ padding: "20px 24px", marginBottom: 20 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#111", marginBottom: 16 }}>
              Nordiska fastighetsaktier — {latest.week}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 10 }}>
              {(latest.stocks || []).map(s => {
                const isPos = s.chg >= 0;
                const color = isPos ? "#16a34a" : "#dc2626";
                const bg    = isPos ? "#f0fdf4" : "#fef2f2";
                // Compare with prev week
                const prevStock = prev?.stocks?.find(ps => ps.ticker === s.ticker);
                return (
                  <div key={s.ticker} style={{ background: "#fafafa", borderRadius: 12, padding: "12px 14px", border: "1.5px solid #f0f0f0" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                      <div>
                        <div style={{ fontSize: 11, fontWeight: 700, color: "#6b7280", letterSpacing: "0.04em" }}>{s.ticker}</div>
                        <div style={{ fontSize: 12, fontWeight: 600, color: "#111", marginTop: 2 }}>{s.name.length > 14 ? s.name.slice(0,13)+"…" : s.name}</div>

          {/* Weekly summary */}
          {latest.summary && (
            <div className="card" style={{ padding: "20px 24px", marginBottom: 20 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>Veckans marknadssummering</div>
              <p style={{ fontSize: 14, color: "#374151", lineHeight: 1.7 }}>{latest.summary}</p>
            </div>
          )}

          {/* Historical weeks */}
          {pulseWeeks.length > 1 && (
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#111", marginBottom: 12 }}>Historik</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {pulseWeeks.slice(1).map(w => (
                  <div key={w.id} className="card" style={{ padding: "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <span style={{ fontSize: 13, fontWeight: 600, color: "#111" }}>{w.week}</span>
                      <span style={{ fontSize: 12, color: "#9ca3af", marginLeft: 10 }}>{w.date}</span>
                    </div>
                    <div style={{ display: "flex", gap: 20, fontSize: 12, color: "#6b7280" }}>
                      {w.rates?.swap5y > 0 && <span>Swap 5Y: <strong style={{ color: "#111" }}>{w.rates.swap5y}%</strong></span>}
                      <span>{(w.stocks || []).filter(s => s.chg >= 0).length}/{(w.stocks || []).length} aktier upp</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}

      {error && <div style={{ marginTop: 14, padding: "11px 16px", background: "#fef2f2", border: "1.5px solid #fecaca", borderRadius: 10, fontSize: 13, color: "#dc2626" }}>{error}</div>}
    </div>
  );
}

  const [searchOpen, setSearchOpen] = useState(false);
  const [selectedCompany, setSelectedCompany] = useState(null);
  const [dupWarnings, setDupWarnings] = useState([]); // [{type:'tx'|'intel', newItem, existing}]
  const [editingTx, setEditingTx] = useState(null); // tx id being edited
  const [editDraft, setEditDraft] = useState({});   // current edits

  const [advOpen, setAdvOpen] = useState(false);

  const [queue, setQueue] = useState([]);
  const [batchRunning, setBatchRunning] = useState(false);
  const [batchDragOver, setBatchDragOver] = useState(false);
  const batchInputRef = useRef(null);

  const [inputText, setInputText] = useState("");
  const [textAnalyzing, setTextAnalyzing] = useState(false);
  const [textResult, setTextResult] = useState(null);
  const [textError, setTextError] = useState(null);

  useEffect(() => {
    async function load() {
      try {
        const dbFetch = (table) => fetch("/api/db", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get", table })
        }).then(r => r.json());
        const [txData, intelData, pulseData] = await Promise.all([
          dbFetch("transactions"), dbFetch("intel"), dbFetch("pulse_weeks")
        ]);
        if (txData?.length) setTransactions(txData.map(t => ({
          ...t, buyerAdvisor: t.buyer_advisor, sellerAdvisor: t.seller_advisor
        })));
        if (intelData?.length) setIntel(intelData);
        if (pulseData?.length) setPulseWeeks(pulseData);
      } catch(e) { console.error("DB load error:", e); }
    }
    load();
  }, []);

  async function persist(key, value) {
    const tableMap = { "radar-transactions": "transactions", "radar-intel": "intel", "radar-pulse": "pulse_weeks" };
    const table = tableMap[key];
    if (!table) return;
    try {
      await fetch("/api/db", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "clear", table }) });
      if (value?.length > 0) {
        const rows = value.map(r => table === "transactions"
          ? { ...r, buyer_advisor: r.buyerAdvisor ?? r.buyer_advisor, seller_advisor: r.sellerAdvisor ?? r.seller_advisor }
          : r);
        await fetch("/api/db", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "upsert", table, data: rows }) });
      }
      const now = new Date();
      setLastUpdated(now);
      setStorageStatus("Sparat ✓");
      setTimeout(() => setStorageStatus(null), 2000);
    } catch(e) { console.error("DB persist error:", e); }
  }

  function formatLastUpdated(date) {
    if (!date) return null;
    const d = new Date(date);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const time = d.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
    return isToday ? "Idag " + time : d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" }) + " " + time;
  }

  function exportCSV(rows) {
    const headers = ["Datum","Kopare","Saljare","Ort","Typ","Kvm","Pris (MSEK)","Yield (%)","Radgivare kopare","Radgivare saljare"];
    const data = rows.map(t => [t.date, t.buyer, t.seller, t.location, t.type, t.sqm ?? "n.a.", t.price ?? "n.a.", t.yield ?? "n.a.", t.buyerAdvisor ?? "n.a.", t.sellerAdvisor ?? "n.a."]);
    const csv = [headers, ...data].map(r => r.map(v => '"' + (v ?? "") + '"').join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const suffix = rows.length < transactions.length ? "-urval" : "";
    const a = document.createElement("a"); a.href = url; a.download = "transaktioner" + suffix + ".csv"; a.click();
    URL.revokeObjectURL(url);
  }

  function applyResult(parsed, source) {
    const now = new Date().toISOString().split("T")[0];
    const newWarnings = [];

    if (parsed.bullets?.length) {
      const entry = { id: Date.now(), date: now, source, category: parsed.category || "MARKNAD", bullets: parsed.bullets };
      setIntel(prev => {
        const dup = findIntelDuplicate(entry, prev);
        if (dup) { newWarnings.push({ type: "intel", newItem: entry, existing: dup, id: `intel-${Date.now()}` }); return prev; }
        const u = [entry, ...prev]; persist("radar-intel", u); return u;
      });
    }
    if (parsed.transactions?.length) {
      const newTx = parsed.transactions.map((t, i) => ({ ...t, id: Date.now() + i + 1, date: now }));
      setTransactions(prev => {
        const toAdd = []; 
        newTx.forEach(t => {
          const dup = findTxDuplicate(t, prev);
          if (dup) newWarnings.push({ type: "tx", newItem: t, existing: dup, id: `tx-${Date.now()}-${Math.random()}` });
          else toAdd.push(t);
        });
        if (toAdd.length) { const u = [...toAdd, ...prev]; persist("radar-transactions", u); return u; }
        return prev;
      });
    }
    if (newWarnings.length) setDupWarnings(prev => [...prev, ...newWarnings]);
  }

  function addPulseWeek(week) {
    setPulseWeeks(prev => {
      // Don't add if same week already exists
      if (prev.find(w => w.week === week.week)) return prev;
      const updated = [week, ...prev];
      persist("radar-pulse", updated);
      return updated;
    });
  }

  function startEdit(tx) {
    setEditingTx(tx.id);
    setEditDraft({ ...tx });
  }
  function cancelEdit() { setEditingTx(null); setEditDraft({}); }
  function saveEdit() {
    setTransactions(prev => {
      const updated = prev.map(t => t.id === editingTx ? { ...editDraft } : t);
      persist("radar-transactions", updated);
      return updated;
    });
    cancelEdit();
  }
  function deleteTx(id) {
    if (!window.confirm("Ta bort denna transaktion?")) return;
    setTransactions(prev => { const u = prev.filter(t => t.id !== id); persist("radar-transactions", u); return u; });
  }

  function addFilesToQueue(files) {
    const pdfs = Array.from(files).filter(f => f.type === "application/pdf");
    if (!pdfs.length) return;
    setQueue(prev => [
      ...prev,
      ...pdfs.map(f => ({ id: `${f.name}-${Date.now()}-${Math.random()}`, file: f, status: "waiting", result: null, error: null }))
    ]);
  }

  const handleBatchDrop = useCallback((e) => {
    e.preventDefault(); setBatchDragOver(false);
    addFilesToQueue(e.dataTransfer.files);
  }, []);

  async function runBatch() {
    setBatchRunning(true);
    // Process waiting items one by one
    setQueue(prev => prev.map(item => item.status === "waiting" ? { ...item, status: "analyzing" } : item));
    const snapshot = queue.filter(i => i.status === "waiting");
    for (const item of snapshot) {
      setQueue(prev => prev.map(i => i.id === item.id ? { ...i, status: "analyzing" } : i));
      try {
        const base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(",")[1]);
          r.onerror = rej;
          r.readAsDataURL(item.file);
        });
        const parsed = await callClaude([
          { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 } },
          { type: "text", text: "Analysera dokumentet och extrahera fastighetstransaktioner, bolagsrörelser och marknadssignaler." },
        ]);
        applyResult(parsed, item.file.name);
        // Also try to extract pulse data from same document
        try {
          const pulseRes = await fetch("/api/claude", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: "claude-sonnet-4-5",
              max_tokens: 1500,
              system: PULSE_SYSTEM_PROMPT,
              messages: [{ role: "user", content: [
                { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64 } },
                { type: "text", text: "Extrahera aktiekurser och räntedata från detta dokument." }
              ]}],
            }),
          });
          const pulseData = await pulseRes.json();
          const pulseRaw = pulseData.content?.map(i => i.text || "").join("") || "{}";
          const pulseParsed = JSON.parse(pulseRaw.replace(/```json|```/g, "").trim());
          if (pulseParsed.week && pulseParsed.stocks?.length > 0) {
            addPulseWeek({ ...pulseParsed, id: Date.now() + 999 });
          }
        } catch {}
        setQueue(prev => prev.map(i => i.id === item.id ? { ...i, status: "done", result: parsed } : i));
      } catch {
        setQueue(prev => prev.map(i => i.id === item.id ? { ...i, status: "error", error: "Analysen misslyckades" } : i));
      }
      // Small delay between files to avoid rate limits
      await new Promise(r => setTimeout(r, 800));
    }
    setBatchRunning(false);
  }

                  style={{ display: "flex", alignItems: "center", gap: 5, background: advOpen || activeAdvFilters > 0 ? "#111" : "none", color: advOpen || activeAdvFilters > 0 ? "#fff" : "#6b7280", border: "1.5px solid", borderColor: advOpen || activeAdvFilters > 0 ? "#111" : "#e5e7eb", borderRadius: 100, padding: "5px 14px", fontSize: 12, fontWeight: 500, fontFamily: "inherit", cursor: "pointer" }}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                  Filter{activeAdvFilters > 0 ? ` (${activeAdvFilters})` : ""}
                </button>
                <button onClick={() => exportCSV(sortedTx)}
                  style={{ display: "flex", alignItems: "center", gap: 6, background: "#111", color: "#fff", border: "none", borderRadius: 100, padding: "6px 16px", fontFamily: "inherit", fontSize: 12, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                  Exportera {sortedTx.length < transactions.length ? `${sortedTx.length} rader` : "alla"} som CSV
                </button>
              </div>

              {/* Row 2: advanced filters (collapsible) */}
              {advOpen && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #e5e7eb", display: "flex", gap: 12, flexWrap: "wrap", alignItems: "flex-end" }}>
                  <div>
                    <div style={{ fontSize: 10, fontWeight: 600, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 5 }}>Fastighetstyp</div>
                    <select value={advSearch.type} onChange={e => setAdvSearch(s => ({ ...s, type: e.target.value }))}
                      style={{ border: "1.5px solid #e5e7eb", borderRadius: 8, padding: "5px 10px", fontSize: 12, fontFamily: "inherit", color: "#111", background: "#fff", outline: "none", cursor: "pointer" }}>
                      <option value="">Alla typer</option>
                      {[...new Set(transactions.map(t => t.type).filter(Boolean))].sort().map(t => (
                        <option key={t} value={t}>{t}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <div style={{ fontSize: 10, fontWeight: 600, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 5 }}>Ort</div>
                    <input value={advSearch.location} onChange={e => setAdvSearch(s => ({ ...s, location: e.target.value }))}
                      placeholder="t.ex. Stockholm"
                      style={{ border: "1.5px solid #e5e7eb", borderRadius: 8, padding: "5px 10px", fontSize: 12, fontFamily: "inherit", color: "#111", background: "#fff", outline: "none", width: 160 }} />
                  </div>
                  {activeAdvFilters > 0 && (
                    <button onClick={() => setAdvSearch({ type: "", location: "", dateFrom2: "", dateTo2: "" })}
                      style={{ background: "none", border: "1.5px solid #e5e7eb", borderRadius: 100, padding: "5px 14px", fontSize: 12, color: "#9ca3af", fontFamily: "inherit", cursor: "pointer", alignSelf: "flex-end" }}>
                      Rensa alla filter
                    </button>
                  )}
                </div>
              )}
            </div>

            {/* Table */}
            <div className="card" style={{ overflow: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 1000 }}>
                <thead>
                  <tr style={{ borderBottom: "1.5px solid #f0f0f0", background: "#fafafa" }}>
                    {["Datum","Köpare","Säljare","Ort","Typ","Kvm","Pris (MSEK)","Yield","Råd. köpare","Råd. säljare",""].map(h => (
                      <th key={h} style={{ padding: "11px 14px", textAlign: "left", fontSize: 11, fontWeight: 600, color: "#9ca3af", letterSpacing: "0.04em", textTransform: "uppercase", whiteSpace: "nowrap" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sortedTx.map((tx, i) => {
                    const isEditing = editingTx === tx.id;
                    const inp = (field, opts = {}) => (
                      <input value={editDraft[field] ?? ""} onChange={e => setEditDraft(d => ({ ...d, [field]: e.target.value }))}
                        style={{ border: "1.5px solid #d1d5db", borderRadius: 6, padding: "3px 7px", fontSize: 12, fontFamily: "inherit", width: opts.wide ? 110 : opts.med ? 80 : 64, outline: "none", background: "#fff" }} />
                    );
                    return (
                      <tr key={tx.id} style={{ borderBottom: i < sortedTx.length-1 ? "1px solid #f9fafb" : "none", background: isEditing ? "#fffbeb" : "transparent", transition: "background 0.15s" }}>
                        <td style={{ padding: "10px 14px", color: "#9ca3af", fontSize: 12, whiteSpace: "nowrap" }}>
                          {isEditing ? inp("date", {med:true}) : tx.date}
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          {isEditing ? inp("buyer", {wide:true}) : (
                            <button onClick={() => setSelectedCompany(tx.buyer)} style={{ background: "none", border: "none", cursor: "pointer", color: "#16a34a", fontWeight: 600, fontSize: 13, fontFamily: "inherit", padding: 0, textDecoration: "underline", textUnderlineOffset: 3, textDecorationColor: "#bbf7d0" }}>{tx.buyer}</button>
                          )}
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          {isEditing ? inp("seller", {wide:true}) : (
                            <button onClick={() => setSelectedCompany(tx.seller)} style={{ background: "none", border: "none", cursor: "pointer", color: "#dc2626", fontWeight: 500, fontSize: 13, fontFamily: "inherit", padding: 0, textDecoration: "underline", textUnderlineOffset: 3, textDecorationColor: "#fecaca" }}>{tx.seller}</button>
                          )}
                        </td>
                        <td style={{ padding: "10px 14px", color: "#374151" }}>
                          {isEditing ? inp("location", {wide:true}) : tx.location}
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          {isEditing ? inp("type", {wide:true}) : <span className="chip">{tx.type}</span>}
                        </td>
                        <td style={{ padding: "10px 14px", color: tx.sqm === "n.a." ? "#d1d5db" : "#374151", fontStyle: tx.sqm === "n.a." && !isEditing ? "italic" : "normal" }}>
                          {isEditing ? inp("sqm") : (tx.sqm === "n.a." ? "n.a." : Number(tx.sqm)?.toLocaleString("sv-SE"))}
                        </td>
                        <td style={{ padding: "10px 14px", fontWeight: !isEditing && tx.price !== "n.a." ? 600 : 400, color: !isEditing && tx.price === "n.a." ? "#d1d5db" : "#111" }}>
                          {isEditing ? inp("price") : (tx.price === "n.a." ? <span style={{ fontStyle: "italic" }}>n.a.</span> : tx.price)}
                        </td>
                        <td style={{ padding: "10px 14px" }}>
                          {isEditing ? inp("yield") : (
                            tx.yield === "n.a." || !tx.yield
                              ? <span style={{ color: "#d1d5db", fontStyle: "italic" }}>n.a.</span>
                              : <span style={{ color: tx.yield > 5.5 ? "#16a34a" : tx.yield > 4.5 ? "#d97706" : "#dc2626", fontWeight: 600 }}>{tx.yield}%</span>
                          )}
                        </td>
                        <td style={{ padding: "10px 14px", color: tx.buyerAdvisor === "n.a." && !isEditing ? "#d1d5db" : "#6b7280", fontSize: 12, fontStyle: tx.buyerAdvisor === "n.a." && !isEditing ? "italic" : "normal" }}>
                          {isEditing ? inp("buyerAdvisor", {wide:true}) : (tx.buyerAdvisor || "n.a.")}
                        </td>
                        <td style={{ padding: "10px 14px", color: tx.sellerAdvisor === "n.a." && !isEditing ? "#d1d5db" : "#6b7280", fontSize: 12, fontStyle: tx.sellerAdvisor === "n.a." && !isEditing ? "italic" : "normal" }}>
                          {isEditing ? inp("sellerAdvisor", {wide:true}) : (tx.sellerAdvisor || "n.a.")}
                        </td>
                        <td style={{ padding: "10px 14px", whiteSpace: "nowrap" }}>
                          {isEditing ? (
                            <div style={{ display: "flex", gap: 6 }}>
                              <button onClick={saveEdit} style={{ background: "#16a34a", color: "#fff", border: "none", borderRadius: 100, padding: "4px 12px", fontSize: 11, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>Spara</button>
                              <button onClick={cancelEdit} style={{ background: "none", border: "1.5px solid #e5e7eb", borderRadius: 100, padding: "4px 10px", fontSize: 11, color: "#6b7280", fontFamily: "inherit", cursor: "pointer" }}>Avbryt</button>
                            </div>
                          ) : (
                            <div style={{ display: "flex", gap: 4, opacity: 0 }} className="row-actions">
                              <button onClick={() => startEdit(tx)} title="Redigera" style={{ background: "none", border: "1.5px solid #e5e7eb", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontSize: 11, color: "#6b7280", fontFamily: "inherit" }}>✎</button>
                              <button onClick={() => deleteTx(tx.id)} title="Ta bort" style={{ background: "none", border: "1.5px solid #fecaca", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontSize: 11, color: "#dc2626", fontFamily: "inherit" }}>×</button>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* COMPANIES */}
        {tab === "companies" && (
          <div className="fade">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 20 }}>
              <h2 style={{ fontFamily: "Instrument Serif, serif", fontSize: 28, fontWeight: 400 }}>Bolagsradar</h2>
              <div style={{ display: "flex", gap: 6 }}>
                {["ALLA","KÖPARE","SÄLJARE","AVVAKTAR"].map(s => (
                  <button key={s} className={`fpill${filterStatus===s?" on":""}`} onClick={()=>setFilterStatus(s)}>
                    {s === "ALLA" ? "Alla" : STATUS_CONFIG[s]?.label || s}
                  </button>
                ))}
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 14 }}>
              {filteredCompanies.map(c => {
                const cfg = STATUS_CONFIG[c.status];
                const ac = c.activity >= 70 ? "#16a34a" : c.activity >= 45 ? "#d97706" : "#dc2626";
                return (
                  <div key={c.name} className="card" style={{ padding: "22px 24px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                      <button onClick={() => setSelectedCompany(c.name)} style={{ background: "none", border: "none", cursor: "pointer", fontFamily: "Instrument Serif, serif", fontSize: 20, color: "#111", padding: 0, textAlign: "left", textDecoration: "underline", textUnderlineOffset: 4, textDecorationColor: "#e5e7eb" }}>{c.name}</button>
                      <span className="pill" style={{ background: cfg.bg, color: cfg.color }}>
                        <span style={{ width: 6, height: 6, borderRadius: "50%", background: cfg.color, display: "inline-block" }} />{cfg.label}
                      </span>
                    </div>
                    <div style={{ marginBottom: 14 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <span style={{ fontSize: 11, color: "#9ca3af", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>Aktivitetsnivå</span>
                        <span style={{ fontSize: 12, fontWeight: 600, color: ac }}>{c.activity}%</span>
                      </div>
                      <div style={{ height: 5, background: "#f3f4f6", borderRadius: 10 }}>
                        <div style={{ height: 5, width: `${c.activity}%`, background: ac, borderRadius: 10, transition: "width 0.8s" }} />
                      </div>
                    </div>
                    <p style={{ fontSize: 13, color: "#6b7280", lineHeight: 1.65, marginBottom: 14 }}>{c.reason}</p>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {c.sectors.map(s => <span key={s} className="chip">{s}</span>)}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* MARKNADSPULS */}
        {tab === "pulse" && (
          <MarketPulse
            pulseWeeks={pulseWeeks}
            onAddWeek={addPulseWeek}
          />
        )}

        {/* ANALYZE */}
        {tab === "analyze" && (
          <div className="fade">
            <h2 style={{ fontFamily: "Instrument Serif, serif", fontSize: 28, fontWeight: 400, marginBottom: 6 }}>Lägg till underlag</h2>
            <p style={{ fontSize: 14, color: "#6b7280", marginBottom: 28, lineHeight: 1.6 }}>
              Ladda upp flera PDF:er på en gång eller klistra in text – AI:n analyserar allt i kö och sparar resultaten automatiskt.
            </p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1px 1fr", gap: 0, alignItems: "start" }}>

              {/* LEFT — BATCH PDF */}
              <div style={{ paddingRight: 36 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div className="panel-label" style={{ marginBottom: 0 }}>PDF-dokument — batch</div>
                  {queue.length > 0 && (
                    <button onClick={() => setQueue([])} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 12, color: "#9ca3af", fontFamily: "inherit" }}>
                      Rensa kö
                    </button>
                  )}
                </div>

                {/* Drop zone */}
                <div
                  className={`drop-zone${batchDragOver ? " over" : ""}`}
                  style={{ padding: "36px 24px", textAlign: "center", marginBottom: 16 }}
                  onDragOver={e => { e.preventDefault(); setBatchDragOver(true); }}
                  onDragLeave={() => setBatchDragOver(false)}
                  onDrop={handleBatchDrop}
                  onClick={() => batchInputRef.current?.click()}
                >
                  <input ref={batchInputRef} type="file" accept="application/pdf" multiple style={{ display: "none" }}
                    onChange={e => { addFilesToQueue(e.target.files); e.target.value = ""; }} />
                  <div style={{ display: "flex", justifyContent: "center", marginBottom: 12 }}><UploadIcon /></div>
                  <div style={{ fontSize: 14, fontWeight: 600, color: "#374151", marginBottom: 5 }}>
                    Dra och släpp PDF:er här
                  </div>
                  <div style={{ fontSize: 13, color: "#9ca3af" }}>Flera filer stöds — klicka eller dra hela mappar</div>
                </div>

                {/* Queue list */}
                {queue.length > 0 && (
                  <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 6 }}>
                    {queue.map(item => {
                      const statusMap = {
                        waiting:   { label: "Väntar",    color: "#9ca3af", bg: "#f9fafb", icon: "○" },
                        analyzing: { label: "Analyserar", color: "#2563eb", bg: "#eff6ff", icon: "spin" },
                        done:      { label: "Klar",       color: "#16a34a", bg: "#f0fdf4", icon: "✓" },
                        error:     { label: "Fel",        color: "#dc2626", bg: "#fef2f2", icon: "✗" },
                      };
                      const s = statusMap[item.status];
                      const txCount = item.result?.transactions?.length || 0;
                      const bCount  = item.result?.bullets?.length || 0;
                      return (
                        <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", background: s.bg, borderRadius: 10, border: `1px solid ${item.status === "done" ? "#bbf7d0" : item.status === "error" ? "#fecaca" : "#f0f0f0"}` }}>
                          <div style={{ flexShrink: 0, width: 20, display: "flex", alignItems: "center", justifyContent: "center" }}>
                            {item.status === "analyzing"
                              ? <svg className="spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2.5" strokeLinecap="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                              : <span style={{ fontSize: 13, color: s.color, fontWeight: 700 }}>{s.icon}</span>
                            }
                          </div>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: 12, fontWeight: 600, color: "#111", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.file.name}</div>
                            <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 1 }}>
                              {item.status === "done"
                                ? `${bCount} insikt${bCount !== 1 ? "er" : ""} · ${txCount} transaktion${txCount !== 1 ? "er" : ""}`
                                : item.status === "error" ? item.error
                                : `${(item.file.size / 1024).toFixed(0)} KB`}
                            </div>
                          </div>
                          <span style={{ fontSize: 10, fontWeight: 600, color: s.color, letterSpacing: "0.04em", textTransform: "uppercase", flexShrink: 0 }}>{s.label}</span>
                          {item.status === "waiting" && (
                            <button onClick={() => setQueue(prev => prev.filter(i => i.id !== item.id))}
                              style={{ background: "none", border: "none", cursor: "pointer", color: "#d1d5db", fontSize: 14, lineHeight: 1, padding: "0 2px", flexShrink: 0 }}>×</button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Summary bar when all done */}
                {queue.length > 0 && queue.every(i => i.status === "done" || i.status === "error") && (
                  <div style={{ padding: "10px 14px", background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 10, fontSize: 13, color: "#16a34a", fontWeight: 600, marginBottom: 14, textAlign: "center" }}>
                    ✓ {queue.filter(i => i.status === "done").length} av {queue.length} filer analyserade och sparade
                  </div>
                )}

                <button
                  className="abtn"
                  disabled={batchRunning || queue.filter(i => i.status === "waiting").length === 0}
                  onClick={runBatch}
                  style={{ width: "100%" }}
                >
                  {batchRunning
                    ? <span style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                        <SpinIcon />
                        Analyserar {queue.filter(i => i.status === "analyzing").length > 0 ? `"${queue.find(i => i.status === "analyzing")?.file.name.slice(0, 20)}..."` : "..."}
                      </span>
                    : queue.filter(i => i.status === "waiting").length > 0
                      ? `Analysera ${queue.filter(i => i.status === "waiting").length} fil${queue.filter(i => i.status === "waiting").length > 1 ? "er" : ""}`
                      : "Lägg till filer ovan"
                  }
                </button>
              </div>

              <div className="divider" />

              {/* RIGHT — TEXT */}
              <div style={{ paddingLeft: 36 }}>
                <div className="panel-label">Mejl eller text</div>
                <textarea value={inputText} onChange={e => setInputText(e.target.value)}
                  placeholder="Klistra in nyhetsbrev, mejl eller annan text här..."
                  style={{ width: "100%", minHeight: 220, background: "#fafafa", border: "1.5px solid #e5e7eb", borderRadius: 14, padding: "14px 16px", color: "#111", fontFamily: "inherit", fontSize: 14, lineHeight: 1.7, marginBottom: 16 }} />
                <button className="abtn" disabled={!inputText.trim() || textAnalyzing} onClick={analyzeText} style={{ width: "100%" }}>
                  {textAnalyzing ? <span style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><SpinIcon />Analyserar text...</span> : "Analysera text"}
                </button>
                {textError && <div style={{ marginTop: 14, padding: "11px 16px", background: "#fef2f2", border: "1.5px solid #fecaca", borderRadius: 10, fontSize: 13, color: "#dc2626" }}>{textError}</div>}
                <ResultCard result={textResult} />
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(React.createElement(App));
  </script>
</body>
</html>
